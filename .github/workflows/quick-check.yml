name: Quick Check

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  quick-check:
    name: Quick Functionality Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Install Playwright
      run: |
        playwright install chromium --with-deps
    
    - name: Quick syntax check
      run: |
        python -m py_compile app.py
        python -m py_compile cricket_workflow.py
        python -m py_compile numerology.py
        python -m py_compile debug.py
        python -m py_compile test.py
    
    - name: Quick import test
      run: |
        python -c "from cricket_workflow import CricketDataScraper, scraper, matches"
        python -c "from numerology import main"
        python -c "import streamlit"
        python -c "import playwright"
        echo "All critical imports successful"
    
    - name: Quick browser test
      run: |
        python -c "
        from cricket_workflow import CricketDataScraper
        with CricketDataScraper(headless=True) as s:
            print('Browser test passed')
        "
    
    - name: Status
      if: always()
      run: |
        echo "Quick check completed: ${{ job.status }}"
