name: Test Crick-Predict Application

on:
  push:
    branches: [ main, master, develop, copilot/** ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:  # Allow manual triggering

jobs:
  test:
    name: Test on Linux
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']
      fail-fast: false  # Continue testing other versions even if one fails
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Display Python version
      run: |
        python --version
        pip --version
    
    - name: Upgrade pip and install build tools
      run: |
        python -m pip install --upgrade pip setuptools wheel
    
    - name: Install Python dependencies
      run: |
        pip install -r requirements.txt
    
    - name: Install Playwright browsers
      run: |
        playwright install chromium
        playwright install-deps chromium
    
    - name: Verify core imports
      run: |
        python -c "import streamlit; print(f'Streamlit version: {streamlit.__version__}')"
        python -c "import playwright; print(f'Playwright imported successfully')"
        python -c "import pandas; print(f'Pandas version: {pandas.__version__}')"
        python -c "import matplotlib; print(f'Matplotlib version: {matplotlib.__version__}')"
        python -c "import bs4; print(f'BeautifulSoup4 version: {bs4.__version__}')"
        python -c "import pytz; print(f'Pytz version: {pytz.__version__}')"
    
    - name: Check module imports
      run: |
        python -c "from cricket_workflow import scraper, matches, get_player_stats; print('cricket_workflow imported successfully')"
        python -c "from numerology import main; print('numerology imported successfully')"
        python -c "from test import matches, debug_matches; print('test imported successfully')"
        python -c "from debug import debug; print('debug imported successfully')"
    
    - name: Test cricket_workflow basic functionality
      run: |
        python -c "
        from cricket_workflow import CricketDataScraper
        print('CricketDataScraper class imported successfully')
        
        # Test class instantiation
        scraper = CricketDataScraper(headless=True, timeout=30000)
        print('CricketDataScraper instantiated successfully')
        "
    
    - name: Validate Python syntax
      run: |
        python -m py_compile app.py
        python -m py_compile cricket_workflow.py
        python -m py_compile numerology.py
        python -m py_compile debug.py
        python -m py_compile test.py
        echo "All Python files have valid syntax"
    
    - name: Check for common code issues
      run: |
        # Check for TODO/FIXME comments
        echo "Checking for TODO/FIXME comments..."
        grep -r "TODO\|FIXME" *.py || echo "No TODO/FIXME found"
        
        # Check for print statements (should use logging in production)
        echo "Checking for print statements..."
        grep -n "print(" *.py | grep -v "# print" || echo "Print statements found (consider using logging)"
    
    - name: Test Streamlit app syntax
      run: |
        # Test if Streamlit can parse the app without running it
        streamlit run app.py --help
        echo "Streamlit app syntax is valid"
    
    - name: Run installation script test
      run: |
        # Test the Linux installation script for syntax errors
        bash -n install_linux.sh
        bash -n run_linux.sh
        echo "Shell scripts have valid syntax"
    
    - name: Test workflow module functions
      run: |
        python -c "
        import sys
        from cricket_workflow import CricketDataScraper
        
        # Test that we can create a scraper instance
        with CricketDataScraper(headless=True, timeout=10000) as scraper:
            print('Browser context created and closed successfully')
        
        print('cricket_workflow module functions tested successfully')
        sys.exit(0)
        "
    
    - name: Generate test report
      if: always()
      run: |
        echo "==================================="
        echo "Test Summary for Python ${{ matrix.python-version }}"
        echo "==================================="
        echo "Python Version: $(python --version)"
        echo "Pip Version: $(pip --version)"
        echo "Streamlit Version: $(streamlit --version)"
        echo "Playwright Version: $(playwright --version)"
        echo "==================================="
        echo "Test Status: ${{ job.status }}"
        echo "==================================="
    
    - name: Upload test artifacts
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-failure-logs-python-${{ matrix.python-version }}
        path: |
          *.log
          *.txt
        retention-days: 7

  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install linting tools
      run: |
        pip install flake8 pylint autopep8
    
    - name: Run flake8
      continue-on-error: true
      run: |
        # E501: Line too long (ignored as it's common in data science)
        # W503: Line break before binary operator (ignored, it's good practice)
        # E402: Module level import not at top of file (common in Streamlit)
        flake8 *.py --count --select=E9,F63,F7,F82 --show-source --statistics
        echo "Flake8 check completed"
    
    - name: Run pylint
      continue-on-error: true
      run: |
        pylint *.py --disable=C,R,W --exit-zero || echo "Pylint completed with warnings"

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install security tools
      run: |
        pip install safety bandit
    
    - name: Run safety check on dependencies
      continue-on-error: true
      run: |
        pip install -r requirements.txt
        safety check --json || echo "Safety check completed with warnings"
    
    - name: Run bandit security scan
      continue-on-error: true
      run: |
        bandit -r *.py -f json -o bandit-report.json || echo "Bandit scan completed"
        cat bandit-report.json || echo "No bandit report generated"
    
    - name: Upload security reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: |
          bandit-report.json
        retention-days: 30

  integration:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Run full installation script
      run: |
        chmod +x install_linux.sh
        bash install_linux.sh
    
    - name: Verify installation
      run: |
        python -c "
        import streamlit
        import playwright
        import pandas
        import matplotlib
        from cricket_workflow import scraper, matches
        from numerology import main
        print('All modules imported successfully after installation')
        "
    
    - name: Test browser automation
      run: |
        python -c "
        from cricket_workflow import CricketDataScraper
        import sys
        
        try:
            with CricketDataScraper(headless=True, timeout=15000) as scraper:
                # Test basic browser functionality
                print('Browser automation test passed')
            sys.exit(0)
        except Exception as e:
            print(f'Browser automation test failed: {e}')
            sys.exit(1)
        "
    
    - name: Generate integration report
      if: always()
      run: |
        echo "==================================="
        echo "Integration Test Summary"
        echo "==================================="
        echo "Installation: Completed"
        echo "Module Imports: Passed"
        echo "Browser Automation: Tested"
        echo "Status: ${{ job.status }}"
        echo "==================================="
